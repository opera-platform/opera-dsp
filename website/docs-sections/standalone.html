<h2 id="standalone">Standalone Setup</h2>
<p>
  When using OPERA-DSP as a standalone project, clone the required submodules.
  These include <strong>rocket-chip</strong>, <strong>dsptools</strong>, and <strong>rocket-dsp-utils</strong>:
</p>
<pre><code><span class="cm"># From the project root</span>
$ make clone_dependencies</code></pre>
<p>This clones all submodules into the <code>./dependencies</code> folder.</p>
